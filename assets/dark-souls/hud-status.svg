<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Status HUD</title>
  <desc id="desc">Three ornate status bars — vigor, endurance and focus — beside an ember medallion, in the style of an action-RPG heads-up display.</desc>
  <defs>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#E8DCC8"/>
      <stop offset="0.45" stop-color="#D4763A"/>
      <stop offset="1" stop-color="#8B1A1A"/>
    </radialGradient>
    <linearGradient id="fillRed" x1="0" x2="1">
      <stop offset="0" stop-color="#3B0C0C"/>
      <stop offset="0.55" stop-color="#8B1A1A"/>
      <stop offset="1" stop-color="#C2481F"/>
    </linearGradient>
    <linearGradient id="fillGreen" x1="0" x2="1">
      <stop offset="0" stop-color="#162910"/>
      <stop offset="0.55" stop-color="#3A6B3A"/>
      <stop offset="1" stop-color="#63904C"/>
    </linearGradient>
    <linearGradient id="fillBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#14212E"/>
      <stop offset="0.55" stop-color="#4A6B8A"/>
      <stop offset="1" stop-color="#7AA0BE"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#E8DCC8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8DCC8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8DCC8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip1"><rect x="127" y="31" width="924" height="16" rx="2"/></clipPath>
    <clipPath id="clip2"><rect x="127" y="67" width="717" height="16" rx="2"/></clipPath>
    <clipPath id="clip3"><rect x="127" y="103" width="535" height="16" rx="2"/></clipPath>
  </defs>

  <!-- medallion -->
  <circle cx="60" cy="75" r="40" fill="#131313" stroke="#C8A832" stroke-width="1.5" opacity="0.95"/>
  <circle cx="60" cy="75" r="33" fill="none" stroke="#7A6420" stroke-width="1"/>
  <path d="M60 58l11 17-11 17-11-17z" fill="url(#ember)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="60" cy="75" r="3" fill="#E8DCC8"/>
  <circle cx="52" cy="66" r="1.3" fill="#D4763A">
    <animate attributeName="cy" values="68;52" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="70" r="1.1" fill="#C8A832">
    <animate attributeName="cy" values="72;54" dur="6.5s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.4;1" dur="6.5s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- status tag -->
  <text x="1134" y="16" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="4" fill="#C8A832" opacity="0.85">STATUS · KINDLED</text>

  <!-- bar 1 : vigor -->
  <rect x="124" y="28" width="1010" height="22" rx="3" fill="#141414" stroke="#C8A832" stroke-width="1.25"/>
  <rect x="125.5" y="29.5" width="1007" height="19" rx="2" fill="none" stroke="#0D0D0D" stroke-width="1"/>
  <path d="M116 33l6 6-6 6-6-6z" fill="#C8A832"/>
  <path d="M1142 33l6 6-6 6-6-6z" fill="#C8A832"/>
  <rect x="127" y="31" width="924" height="16" rx="2" fill="url(#fillRed)"/>
  <rect x="127" y="31" width="924" height="4" rx="2" fill="#E8DCC8" opacity="0.12"/>
  <g clip-path="url(#clip1)">
    <rect x="34" y="31" width="80" height="16" fill="url(#shine)" opacity="0.5">
      <animate attributeName="x" values="34;1060" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="138" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#E8DCC8" opacity="0.9">VIGOR · QUALITY-FIRST ENGINEERING</text>

  <!-- bar 2 : endurance -->
  <rect x="124" y="64" width="860" height="22" rx="3" fill="#141414" stroke="#C8A832" stroke-width="1.25"/>
  <rect x="125.5" y="65.5" width="857" height="19" rx="2" fill="none" stroke="#0D0D0D" stroke-width="1"/>
  <path d="M116 69l6 6-6 6-6-6z" fill="#C8A832"/>
  <path d="M992 69l6 6-6 6-6-6z" fill="#C8A832"/>
  <rect x="127" y="67" width="717" height="16" rx="2" fill="url(#fillGreen)"/>
  <rect x="127" y="67" width="717" height="4" rx="2" fill="#E8DCC8" opacity="0.12"/>
  <g clip-path="url(#clip2)">
    <rect x="34" y="67" width="80" height="16" fill="url(#shine)" opacity="0.5">
      <animate attributeName="x" values="34;860" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="138" y="79" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#E8DCC8" opacity="0.9">ENDURANCE · FULLSTACK DELIVERY</text>

  <!-- bar 3 : focus -->
  <rect x="124" y="100" width="710" height="22" rx="3" fill="#141414" stroke="#C8A832" stroke-width="1.25"/>
  <rect x="125.5" y="101.5" width="707" height="19" rx="2" fill="none" stroke="#0D0D0D" stroke-width="1"/>
  <path d="M116 105l6 6-6 6-6-6z" fill="#C8A832"/>
  <path d="M842 105l6 6-6 6-6-6z" fill="#C8A832"/>
  <rect x="127" y="103" width="535" height="16" rx="2" fill="url(#fillBlue)"/>
  <rect x="127" y="103" width="535" height="4" rx="2" fill="#E8DCC8" opacity="0.12"/>
  <g clip-path="url(#clip3)">
    <rect x="34" y="103" width="80" height="16" fill="url(#shine)" opacity="0.5">
      <animate attributeName="x" values="34;680" dur="9s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="138" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#E8DCC8" opacity="0.9">FOCUS · APPLIED AI</text>
</svg>
