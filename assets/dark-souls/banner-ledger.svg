<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="title desc">
  <title id="title">The ledger</title>
  <desc id="desc">Dark on-screen message banner reading THE LEDGER.</desc>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D0D" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#0D0D0D" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#0D0D0D"/>
      <stop offset="0.72" stop-color="#0D0D0D" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0D0D0D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineL" x1="0" x2="1">
      <stop offset="0" stop-color="#C8A832" stop-opacity="0"/>
      <stop offset="1" stop-color="#C8A832" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0" x2="1">
      <stop offset="0" stop-color="#C8A832" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C8A832" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect y="6" width="1200" height="98" fill="url(#band)"/>
  <line x1="70" y1="55" x2="389" y2="55" stroke="url(#lineL)" stroke-width="1"/>
  <line x1="811" y1="55" x2="1130" y2="55" stroke="url(#lineR)" stroke-width="1"/>
  <path d="M395 51l6 4-6 4-6-4z" fill="#C8A832" opacity="0.9"/>
  <path d="M805 51l6 4-6 4-6-4z" fill="#C8A832" opacity="0.9"/>
  <text x="600" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="12" fill="#C8A832" opacity="0.75" filter="url(#glow)">THE LEDGER</text>
  <text x="600" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="12" fill="#E8DCC8">THE LEDGER</text>
  <g fill="#D4763A">
    <circle cx="520" cy="82" r="1.6" opacity="0">
      <animate attributeName="cy" values="84;36" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.35;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="612" cy="82" r="1.3" opacity="0">
      <animate attributeName="cy" values="84;40" dur="7s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.35;1" dur="7s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="676" cy="82" r="1.5" opacity="0">
      <animate attributeName="cy" values="84;38" dur="6.5s" begin="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.35;1" dur="6.5s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
