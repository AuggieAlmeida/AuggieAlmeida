<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="88" viewBox="0 0 1200 88" role="img" aria-labelledby="title desc">
  <title id="title">Repo Explorer — shipped</title>
  <desc id="desc">Boss-style health bar for the project Repo Explorer, nearly depleted, marked as shipped.</desc>
  <defs>
    <linearGradient id="hp" x1="0" x2="1">
      <stop offset="0" stop-color="#3B0C0C"/>
      <stop offset="0.6" stop-color="#8B1A1A"/>
      <stop offset="1" stop-color="#B23A1F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D0D" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#0D0D0D" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#0D0D0D" stop-opacity="0.96"/>
      <stop offset="0.82" stop-color="#0D0D0D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0D0D0D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="88" fill="url(#band)"/>
  <text x="44" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="5" fill="#C8A832" opacity="0.6" filter="url(#glow)">Repo Explorer</text>
  <text x="44" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="5" fill="#E8DCC8">Repo Explorer</text>
  <text x="1158" y="30" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="4" fill="#C8A832">SHIPPED</text>
  <rect x="42" y="44" width="1116" height="16" rx="2" fill="#141414" stroke="#C8A832" stroke-width="1.25"/>
  <rect x="43.5" y="45.5" width="1113" height="13" rx="1.5" fill="none" stroke="#0D0D0D" stroke-width="1"/>
  <path d="M34 52l6-5v10z" fill="#C8A832"/>
  <path d="M1166 52l-6-5v10z" fill="#C8A832"/>
  <rect x="45" y="47" width="156" height="10" rx="1.5" fill="url(#hp)"/>
  <rect x="45" y="47" width="156" height="3" rx="1.5" fill="#E8DCC8" opacity="0.14"/>
  <rect x="201" y="47" width="78" height="10" fill="#D4763A" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
